name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and build tools
        run: python -m pip install pytest build ruff numpy scipy matplotlib "bokeh>=3.6,<4"
      - name: Install local browser for interface integration tests
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Lint
        run: python -m ruff check .
      - name: Build sdist and wheel
        run: python -m build
      - name: Install wheel without runtime dependencies
        run: python -m pip install --no-deps dist/*.whl
      - name: Test installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -q
      - name: Run measured-area example in isolated Python
        working-directory: ${{ runner.temp }}
        run: python -I "$GITHUB_WORKSPACE/examples/use_measured_areas.py"
      - name: Generate analytical spectra and run the spectral CLI
        working-directory: ${{ runner.temp }}
        run: |
          python -I "$GITHUB_WORKSPACE/examples/generate_synthetic_spectra.py" --output-dir synthetic
          sc-teff fit synthetic/clean.csv --delimiter , --header --wavelength-column wavelength --flux-column flux --mask-column exclude --wavelength-unit angstrom --wavelength-frame air --continuum-normalised --feh -0.2 --output-dir fit-results --label "Analytical synthetic spectrum"
      - name: Reproduce a saved analytical review without the browser
        working-directory: ${{ runner.temp }}
        run: |
          python -I "$GITHUB_WORKSPACE/examples/demo_interactive_review.py" --output-dir review-demo --scripted-review
          sc-teff replay review-demo/spectrum.csv --review-file review-demo/review.json --output-dir reviewed-results --label "Analytical synthetic review"
      - name: Reproduce manual analytical continuum corrections
        working-directory: ${{ runner.temp }}
        run: |
          python -I "$GITHUB_WORKSPACE/examples/demo_continuum_review.py" --output-dir continuum-demo --scripted-review
          sc-teff replay continuum-demo/spectrum.csv --review-file continuum-demo/review.json --output-dir continuum-results --label "Analytical manual continuum review"
