name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and build tools
        run: python -m pip install pytest build ruff numpy scipy matplotlib
      - name: Lint
        run: python -m ruff check .
      - name: Build sdist and wheel
        run: python -m build
      - name: Install wheel without runtime dependencies
        run: python -m pip install --no-deps dist/*.whl
      - name: Test installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -q
      - name: Run measured-area example in isolated Python
        working-directory: ${{ runner.temp }}
        run: python -I "$GITHUB_WORKSPACE/examples/use_measured_areas.py"
      - name: Generate analytical spectra and run the spectral CLI
        working-directory: ${{ runner.temp }}
        run: |
          python -I "$GITHUB_WORKSPACE/examples/generate_synthetic_spectra.py" --output-dir synthetic
          sc-teff fit synthetic/clean.csv --delimiter , --header --wavelength-column wavelength --flux-column flux --mask-column exclude --wavelength-unit angstrom --wavelength-frame air --continuum-normalised --feh -0.2 --output-dir fit-results --label "Analytical synthetic spectrum"
