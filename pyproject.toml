[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-teff-method"
version = "0.1.0"
description = "Frozen K-band Sc I Gaussian-area temperature calibrations for cool giants"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Brian Thorsbro"}]
license = "MIT"
license-files = ["LICENSE", "DATA_NOTICE.md"]
dependencies = []
keywords = ["astronomy", "stellar temperatures", "scandium", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Repository = "https://github.com/thorsbro/sc_teff_method"
Issues = "https://github.com/thorsbro/sc_teff_method/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
spectra = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]
inspect = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "bokeh>=3.6,<4"]
dev = [
    "pytest>=8", "build>=1.2", "ruff>=0.6",
    "numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8",
    "bokeh>=3.6,<4", "playwright>=1.50",
]

[project.scripts]
sc-teff = "sc_teff_method.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
sc_teff_method = ["py.typed", "data/*/*.json", "data/*/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
